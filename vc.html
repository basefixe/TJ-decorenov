  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; }
    body {
      font-family: Inter, Arial, sans-serif;
      background:#f4f6f8;
      color:#222;
    }

    /* Slider container fullscreen */
    .slider-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Header shown above slides */
    .slider-header {
      position: absolute;
      top: 18px;
      left: 28px;
      right: 28px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index: 30;
      pointer-events: auto;
    }
    .slider-header h1 {
      color: #fff;
      font-size: 20px;
      letter-spacing:1px;
    }
    .slider-header nav ul {
      list-style:none;
      display:flex;
      gap:22px;
    }
    .slider-header nav a {
      color:#fff;
      text-decoration:none;
      font-weight:600;
      opacity:0.9;
    }

    /* Slides wrapper */
    .slider { position: absolute; inset:0; height:100%; width:100%; }

    /* Each slide */
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 900ms ease;
      z-index: 10;
      pointer-events: none;
    }
    .slide.active { opacity: 1; pointer-events: auto; z-index: 20; }

    /* img covers */
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* important */
      display: block;
    }

    /* dark overlay to keep text readable */
    .slide .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 15;
    }

    /* arrows */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      background: rgba(0,0,0,0.25);
      border: none;
      color: #fff;
      font-size: 34px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 50%;
      transition: transform .18s ease, background .18s ease;
      backdrop-filter: blur(2px);
    }
    .arrow:hover { transform: translateY(-50%) scale(1.08); background: rgba(0,0,0,0.35); }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }

    /* scroll down chevron */
    .scroll-down {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      color: #fff;
      font-size: 28px;
      opacity: 0.95;
      animation: bounce 1.6s infinite;
      pointer-events: none;
    }
    @keyframes bounce {
      0% { transform: translate(-50%,0); }
      50% { transform: translate(-50%,8px); }
      100% { transform: translate(-50%,0); }
    }

    /* make sure content below slider isn't hidden */
    main { min-height: 60vh; }

    /* small responsive tweaks */
    @media (max-width:720px){
      .slider-header h1 { font-size: 18px; }
      .arrow { width:48px; height:48px; font-size:28px; }
    }
  </style>
</head>

    <header class="slider-header" role="banner">

  <!-- Example page content (you can remove/change) -->
  <script>
    // JavaScript minimal et fiable pour faire fonctionner le slider
    (function(){
      const slides = Array.from(document.querySelectorAll('.slide'));
      const btnPrev = document.querySelector('.arrow.left');
      const btnNext = document.querySelector('.arrow.right');
      let current = 0;
      let timer = null;
      const AUTO_DELAY = 6000;

      function goTo(index){
        // clamp
        index = (index + slides.length) % slides.length;
        slides.forEach((s,i) => {
          s.classList.toggle('active', i === index);
          s.setAttribute('aria-hidden', i === index ? 'false' : 'true');
        });
        current = index;
      }

      function next(){
        goTo(current + 1);
      }
      function prev(){
        goTo(current - 1);
      }

      // attach events
      btnNext.addEventListener('click', () => {
        next();
        resetTimer();
      });
      btnPrev.addEventListener('click', () => {
        prev();
        resetTimer();
      });

      // keyboard navigation (left/right)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { prev(); resetTimer(); }
        if (e.key === 'ArrowRight') { next(); resetTimer(); }
      });

      // autoplay
      function startTimer(){
        stopTimer();
        timer = setInterval(next, AUTO_DELAY);
      }
      function stopTimer(){
        if (timer) { clearInterval(timer); timer = null; }
      }
      function resetTimer(){
        startTimer();
      }

      // ensure first image is visible (in case images are slow)
      slides.forEach((s,i) => {
        if (i === 0) s.classList.add('active');
      });

      // start autoplay
      startTimer();

      // optional: pause autoplay when user hovers on arrows
      [btnNext, btnPrev].forEach(btn => {
        btn.addEventListener('mouseenter', stopTimer);
        btn.addEventListener('mouseleave', startTimer);
      });

      // make images cover correctly on resize (object-fit handles it)
      window.addEventListener('visibilitychange', () => {
        if (document.hidden) stopTimer(); else startTimer();
      });

    })();
  </script>

/* ------------------------------------------- */
/* HEADER */

header {
  background: #111;
  padding: 25px 40px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;

header h1 {
  font-size: 1.8rem;
  letter-spacing: 1px;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 30px;
}

nav a {
  color: #fff;
  font-weight: 500;
  text-decoration: none;
  position: relative;
  padding-bottom: 4px;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  bottom: 0;
  left: 0;
  background: #f6c500;
  transition: width .3s ease;
}

nav a:hover::after {
  width: 100%;
}

/* ------------------------------------------- */
/* HERO */
/* ------------------------------------------- */

#hero {
  text-align: center;
  padding: 100px 20px;
  background: linear-gradient(to right, #111, #333);
  color: white;
  border-radius: 0 0 35px 35px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#hero h2 {
  font-size: 2.6rem;
  margin-bottom: 15px;
  animation: fadeInDown .8s ease-out;
}

#hero p {
  max-width: 800px;
  margin: auto;
  opacity: 0.9;
  animation: fadeInUp 1s ease-out;
}

/* ANIMATIONS */
@keyframes fadeInDown {
  from { transform: translateY(-20px); opacity: 0;}
  to { transform: translateY(0); opacity: 1;}
}
@keyframes fadeInUp {
  from { transform: translateY(20px); opacity: 0;}
  to { transform: translateY(0); opacity: 1;}
}

/* ------------------------------------------- */
/* PRESTATIONS */
/* ------------------------------------------- */

#prestations {
  padding: 70px 30px;
}

#prestations h2 {
  text-align: center;
  font-size: 2.2rem;
  margin-bottom: 50px;
  position: relative;
}

#prestations h2::after {
  content: "";
  width: 80px;
  height: 4px;
  background: #f6c500;
  display: block;
  margin: 15px auto 0;
  border-radius: 3px;
}

.prestation {
  background: white;
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  transition: transform .3s ease, box-shadow .3s ease;
  text-align: center;
}

.prestation:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 28px rgba(0,0,0,0.15);
}

.prestation img {
  width: 100%;
  max-width: 320px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.prestation h3 {
  font-size: 1.4rem;
  margin-bottom: 10px;
  color: #111;
}

.prestation a {
  color: #111;

  padding-bottom: 3px;
  font-weight: bold;
  transition: color .3s ease, border-color .3s ease;
}

.prestation a:hover {
  color: #f6c500;
  border-color: #111;
